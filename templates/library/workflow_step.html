{% extends "base.html" %}
{% block title %} - {{ headline }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="surface rounded-4 p-4 p-lg-5">
      <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">
        <div>
          <div class="text-uppercase small text-secondary mb-1">{{ headline }}</div>
          <h2 class="display-6 fw-bold mb-2">{{ desk.number }}</h2>
          <p class="muted-copy mb-0">{{ body_message }}</p>
        </div>
        <div class="badge rounded-pill px-3 py-2 {% if illustration_state == 'occupied' %}bg-danger{% elif illustration_state == 'away' %}bg-warning text-dark{% else %}bg-success{% endif %}">
          {{ illustration_state|title }}
        </div>
      </div>
      <div class="mt-4 d-flex flex-wrap gap-2">
        <a href="{{ next_action_url }}" class="btn btn-light btn-lg">{{ next_action_label }}</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
